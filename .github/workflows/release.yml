name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: house-control-card
          path: dist/house-control-card.js
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/house-control-card.js
