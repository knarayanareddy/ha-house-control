<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ha-house-control — sample 3D room</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0e1a;
        font-family: system-ui, -apple-system, sans-serif;
        color: #dfe6f5;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #badge {
        position: fixed;
        left: 16px;
        top: 16px;
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(10, 14, 26, 0.65);
        backdrop-filter: blur(6px);
        font-size: 14px;
        pointer-events: none;
      }
      #badge b { color: #8ea6ff; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div id="badge"><b>ha-house-control</b> · sample 3D room (procedural Three.js)</div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
